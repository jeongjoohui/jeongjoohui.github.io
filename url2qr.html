<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL2QR | QR코드 만들기</title><style>*{box-sizing:border-box}body{margin:0;color:#243c35;font-family:Arial,"Apple SD Gothic Neo",sans-serif;background:radial-gradient(circle at 15% 20%,#dff6df,transparent 45%),radial-gradient(circle at 85% 70%,#fbe4d7,transparent 45%),#fafbf6;min-height:100vh}header,main,footer{max-width:1000px;margin:auto}header{padding:30px 24px;display:flex;justify-content:space-between;align-items:center}a{color:#276651;text-decoration:none}nav{display:flex;gap:24px}main{padding:55px 24px}h1{font-size:52px;letter-spacing:-2px;margin:15px 0 22px}p{line-height:1.7;color:#61766d}.eyebrow{font-size:13px;letter-spacing:2px;font-weight:bold;color:#40836a}.card{background:#ffffffcc;border:1px solid #dce8df;border-radius:24px;padding:32px;margin:24px 0;box-shadow:0 15px 50px #24452c08}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.grid .card{margin:0}button,.button{display:inline-block;background:#28654f;color:white;padding:15px 24px;border:0;border-radius:12px;font-size:16px;cursor:pointer}button:disabled{opacity:.45;cursor:default}input{width:100%;padding:16px;border:1px solid #cbdacf;border-radius:12px;font-size:17px;margin:12px 0;background:#fff}label{font-weight:bold}footer{padding:24px;font-size:13px;color:#74857c;border-top:1px solid #dce8df}.result{text-align:center}canvas{max-width:100%;border-radius:12px}#message{min-height:28px}#result[hidden]{display:none}.row{display:flex;gap:12px;align-items:center}h2{font-size:24px}a:hover{text-decoration:underline}@media(max-width:650px){.grid{grid-template-columns:1fr}h1{font-size:36px}nav{gap:12px;font-size:13px}main{padding-top:25px}}</style><header><a href="/" style="font-size:22px;font-weight:bold">Juhui's Web Studio</a><nav><a href="/qrnshort.html">QRnShort</a><a href="/">홈</a></nav></header><main><span class="eyebrow">PROJECT 04 · URL2QR</span><h1>주소 하나, QR코드 하나.</h1><p>URL을 입력하면 공유할 수 있는 QR코드가 만들어집니다.</p><section class="card"><div id="result" class="result" hidden><canvas id="qr" width="360" height="360" title="클릭하여 JPG 다운로드"></canvas><p>QR코드를 클릭하면 JPG 파일로 저장됩니다.</p></div><form id="form"><label for="url">URL 입력</label><input id="url" type="url" placeholder="https://example.com" required><button id="submit">QR코드 생성</button></form><p id="message" role="status"></p></section><script>
const form=document.querySelector('#form'), input=document.querySelector('#url'), msg=document.querySelector('#message'), btn=document.querySelector('#submit'), canvas=document.querySelector('#qr');
form.onsubmit=async e=>{e.preventDefault();const u=new URL(input.value);if(!['http:','https:'].includes(u.protocol)){msg.textContent='http 또는 https 주소를 입력하세요.';return;}btn.disabled=true;msg.textContent='QR코드를 생성하고 있습니다…';try{const image=new Image();image.crossOrigin='anonymous';await new Promise((ok,no)=>{image.onload=ok;image.onerror=no;image.src='https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=20&data='+encodeURIComponent(u.href)});canvas.getContext('2d').drawImage(image,0,0,360,360);document.querySelector('#result').hidden=false;msg.textContent='QR코드 생성 완료';}catch{msg.textContent='QR 생성 서비스에 연결할 수 없습니다. 잠시 후 다시 시도하세요.';}finally{btn.disabled=false}};
canvas.onclick=()=>{const a=document.createElement('a');a.href=canvas.toDataURL('image/jpeg',.95);a.download='URL2QR.jpg';a.click()};</script></main><footer>정주휘 · 바이브코딩 프로젝트 · GitHub Pages</footer></html>
