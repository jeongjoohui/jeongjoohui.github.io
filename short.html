<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QRnShort | URL단축</title><style>*{box-sizing:border-box}body{margin:0;color:#243c35;font-family:Arial,"Apple SD Gothic Neo",sans-serif;background:radial-gradient(circle at 15% 20%,#dff6df,transparent 45%),radial-gradient(circle at 85% 70%,#fbe4d7,transparent 45%),#fafbf6;min-height:100vh}header,main,footer{max-width:1000px;margin:auto}header{padding:30px 24px;display:flex;justify-content:space-between;align-items:center}a{color:#276651;text-decoration:none}nav{display:flex;gap:24px}main{padding:55px 24px}h1{font-size:52px;letter-spacing:-2px;margin:15px 0 22px}p{line-height:1.7;color:#61766d}.eyebrow{font-size:13px;letter-spacing:2px;font-weight:bold;color:#40836a}.card{background:#ffffffcc;border:1px solid #dce8df;border-radius:24px;padding:32px;margin:24px 0;box-shadow:0 15px 50px #24452c08}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.grid .card{margin:0}button,.button{display:inline-block;background:#28654f;color:white;padding:15px 24px;border:0;border-radius:12px;font-size:16px;cursor:pointer}button:disabled{opacity:.45;cursor:default}input{width:100%;padding:16px;border:1px solid #cbdacf;border-radius:12px;font-size:17px;margin:12px 0;background:#fff}label{font-weight:bold}footer{padding:24px;font-size:13px;color:#74857c;border-top:1px solid #dce8df}.result{text-align:center}canvas{max-width:100%;border-radius:12px}#message{min-height:28px}#result[hidden]{display:none}.row{display:flex;gap:12px;align-items:center}h2{font-size:24px}a:hover{text-decoration:underline}@media(max-width:650px){.grid{grid-template-columns:1fr}h1{font-size:36px}nav{gap:12px;font-size:13px}main{padding-top:25px}}</style><header><a href="/" style="font-size:22px;font-weight:bold">Juhui's Web Studio</a><nav><a href="qrnshort.html">QRnShort</a><a href="url2qr.html">QR코드</a></nav></header><main><span class="eyebrow">PROJECT 06 · URL SHORTENER</span><h1>긴 링크를 짧게.</h1><p>URL을 입력하고 단축하기를 눌러 보세요.</p><section class="card"><form id="form"><label for="url">URL 입력</label><input id="url" type="url" placeholder="https://example.com" required><button id="submit" disabled>단축하기</button></form><p id="message" role="status"></p><div id="result" hidden><label for="output">단축 URL</label><input id="output" readonly><div class="row"><button id="copy">복사</button><a id="visit" class="button" target="_blank" rel="noopener">링크 열기 ↗</a></div></div></section><p style="font-size:13px">URL 단축은 Shrtr 서비스를 사용합니다.</p><script>
const input=document.querySelector('#url'),btn=document.querySelector('#submit'),msg=document.querySelector('#message'),output=document.querySelector('#output');let busy=false;
input.oninput=()=>{btn.disabled=busy||!input.value.trim()};
async function shorten(url){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);try{const response=await fetch('https://shrtr.top/api/v1/shorten',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url}),signal:controller.signal});const data=await response.json();if(!response.ok)throw new Error(data.detail||'단축 서비스 응답 오류');return data.short_url;}catch(err){if(err.name==='AbortError')throw new Error('응답 시간이 초과되었습니다. 잠시 후 다시 시도하세요.');throw err;}finally{clearTimeout(timer)}}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const url=new URL(input.value);if(!['https:','http:'].includes(url.protocol)){msg.textContent='http 또는 https 주소를 입력하세요.';return}busy=true;btn.disabled=true;btn.textContent='단축 중…';document.querySelector('#result').hidden=true;msg.textContent='';try{const short=await shorten(url.href);if(!/^https:\/\/shrtr\.top\/s\/[A-Za-z0-9_-]+$/.test(short))throw new Error('올바르지 않은 응답입니다.');output.value=short;document.querySelector('#visit').href=short;document.querySelector('#result').hidden=false;msg.textContent='단축 URL 생성 완료';}catch(err){msg.textContent=err.message}finally{busy=false;btn.disabled=!input.value.trim();btn.textContent='단축하기'}};
document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(output.value);msg.textContent='복사하였습니다.'}catch{output.select();msg.textContent='주소를 선택했습니다. 직접 복사해 주세요.'}};</script></main><footer>정주휘 · 바이브코딩 프로젝트 · GitHub Pages</footer></html>
